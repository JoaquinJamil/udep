<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 95%;
            margin: 0 auto;
            text-align: left;
        }
        .clock-container {
            text-align: center;
        }
        .clock {
            font-size: 75px;
            margin-bottom: 20px;
        }
        .content {
            display: flex;
            justify-content: space-between;
        }
        .left-content {
            flex: 1;
            padding-right: 10px;
        }
        .right-content {
            flex: 1;
            padding-left: 10px;
        }
        .textbox {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            font-size: 18px;
        }
        .textboxlong {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            font-size: 18px;
            height: 100px;
        }
        label {
            display: inline-block;
            width: 150px;
            text-align: right;
            margin-right: 10px;
        }
        .picture {
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 20px auto;
        }
        /* Make sure the form fields and picture split the screen */
        .split-container {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="clock-container">
            <div class="clock" id="clock"></div>
        </div>
        <div class="split-container">
            <div class="left-content">
                <form>
                    <label for="curso">Curso:</label>
                    <input type="text" id="curso" class="textbox" required><br>
                    <label for="profesor">Profesor(a):</label>
                    <input type="text" id="profesor" class="textbox" required><br>
                    <label for="evaluacion">Evaluación:</label>
                    <input type="text" id="evaluacion" class="textbox" required><br>
                    <label for="fecha">Fecha:</label>
                    <input type="text" id="fecha" class="textbox" required><br>
                    <label for="hora_inicio">Hora inicio:</label>
                    <input type="text" id="hora_inicio" class="textbox" required><br>
                    <label for="hora_fin">Hora fin:</label>
                    <input type="text" id="hora_fin" class="textbox" required><br>
                    <label for="indicaciones">Indicaciones adicionales:</label>
                    <textarea id="indicaciones" class="textboxlong" required></textarea>
                </form>
            </div>
            <div class="right-content">
                <img src="https://via.placeholder.com/400" alt="Placeholder Image" class="picture">
            </div>
        </div>
    </div>

    <script>
    function updateClock() {
        var now = new Date();
        var clock = document.getElementById('clock');
        var hours = ('0' + now.getHours()).slice(-2);
        var minutes = ('0' + now.getMinutes()).slice(-2);
        var seconds = ('0' + now.getSeconds()).slice(-2);
        clock.textContent = hours + ':' + minutes + ':' + seconds;
    }
    setInterval(updateClock, 1000);
    </script>
</body>
</html>
